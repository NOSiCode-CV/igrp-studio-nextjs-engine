workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: always

stages:
  - test
  - build
variables:
  SONAR_SCANNER_OPTS: "-Xmx1024m"

test:
  stage: test
  image: node:slim
  script:
    - npm install
    - npm run test -- --coverage
  artifacts:
    paths:
      - coverage/
    expire_in: 1 day
  only:
    - master

.sonarqube_scan:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=nextjs_engine_key
  only:
    - master

build_packagedev:
  image: node:slim
  stage: build
  only:
    - master
  before_script:
    - test -n "$SONATYPE_USERNAME" || { echo "SONATYPE_USERNAME CI variable is required"; exit 1; }
    - test -n "$SONATYPE_PASSWORD" || { echo "SONATYPE_PASSWORD CI variable is required"; exit 1; }
    - printf '@igrp:registry=https://sonatype.nosi.cv/repository/igrp/\n//sonatype.nosi.cv/repository/igrp/:username=%s\n//sonatype.nosi.cv/repository/igrp/:_password=%s\n' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" > "$HOME/.npmrc"
  script:
    - npm install
    - npm run build
    - npm run deploy
